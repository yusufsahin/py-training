services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contact_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contact_app"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: contact_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_PORT: "5432"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web,0.0.0.0
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
